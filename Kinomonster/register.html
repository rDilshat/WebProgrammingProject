<main>
  <section class="login">
    <div class="form-container">
      <p>Register</p>

      <form id="registerForm" action="pages/register.php" method="post">
        <p class="form-status" role="alert" hidden></p>
        <label for="registerFirstName">First Name</label>
        <input
          id="registerFirstName"
          type="text"
          name="firstName"
          autocomplete="given-name"
          required
        >

        <label for="registerLastName">Last Name</label>
        <input
          id="registerLastName"
          type="text"
          name="lastName"
          autocomplete="family-name"
          required
        >

        <label for="registerEmail">Email</label>
        <input
          id="registerEmail"
          type="email"
          name="email"
          autocomplete="email"
          required
        >

        <label for="registerPassword">Password</label>
        <input
          id="registerPassword"
          type="password"
          name="password"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <label for="repeatPassword">Repeat Password</label>
        <input
          id="repeatPassword"
          type="password"
          name="repeatPassword"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <input type="submit" value="Register">
      </form>

      <p>or <a href="login.html">Log In</a></p>
    </div>
  </section>
